name: collect
run-name: ${{ github.event_name == 'schedule' && 'Будильник' || (inputs.reason == 'chain' && 'Продолжение смены' || 'Обновить сейчас') }}

on:
  # Сервер — одна долгая задача (benzin.py worker), работает круглосуточно: с 7:00 до 24:00 МСК
  # собирает данные каждые 10 минут, ночью — только по кнопке «Обновить». Каждые ~6 часов задача
  # сама запускает своё продолжение. Расписание ниже — только «будильник» на случай, если задача не работает.
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (пока сервер работает, будильник ждёт в очереди и не тратит время)
  workflow_dispatch:                  # кнопка «Обновить сейчас»: Actions → collect → Run workflow
    inputs:
      reason:
        description: "Служебное поле — оставьте как есть"
        type: string
        default: manual

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
      SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
      GH_TOKEN: ${{ github.token }}
      REASON: ${{ github.event_name == 'schedule' && 'schedule' || inputs.reason || 'manual' }}
    steps:
      - uses: actions/checkout@v5

      - name: Подготовка
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$PAGES_DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$PAGES_DEPLOY_KEY" > ~/.ssh/pages && chmod 600 ~/.ssh/pages
            echo "PAGES_KEY_FILE=$HOME/.ssh/pages" >> "$GITHUB_ENV"
          fi

      - name: Сервер (сбор 7–24 МСК, ночью — по кнопке)
        run: python3 -u benzin.py worker --reason "$REASON"
